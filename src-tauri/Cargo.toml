[package]
name = "codify-desktop"
version = "0.2.0"
description = "Codify Desktop — AI-powered coding assistant"
authors = ["Codify Team"]
license = "MIT"
repository = "https://github.com/GeneticxCln/Codify"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "codify_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
