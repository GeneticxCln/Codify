name: check

# CONTRIBUTING.md states the bar in one line: "`make check` must pass." This runs
# that same gate in CI — the union of the three jobs below is exactly the targets
# `make check` depends on (lint, typecheck, test-ui, typecheck-ui-tests, test,
# test-streams, bench-smoke, build-ui, check-tauri), split by toolchain so a Python failure
# cannot hide a Rust one and
# each job installs only the toolchain it needs.
#
# Until this existed there was no CI at all, and the failures that reached the
# repository were the ones a single local interpreter cannot see: a PEP 701
# f-string that parsed on 3.14 and was a SyntaxError on the declared 3.10 minimum,
# and a WebSocket isolation test that skipped itself (passing) whenever an
# undeclared `websockets` package was missing.
#
# NOTE: this workflow runs on every pull request, on every push to master, and by hand
# (`workflow_dispatch`). The gate is still `make ci` in the Makefile (the pre-push hook,
# `make hooks`), which runs these same targets on the developer's machine, on the host
# toolchain and on the declared-minimum Python (provisioning it rather than skipping it).
# This is the second opinion from a machine that is not theirs: a clean Ubuntu image with
# nothing left over in a `.venv` or `~/.cargo`. Keep the two in step, or fold this file
# into `make ci` and drop the duplicate definition.
#
# History, so nobody has to rediscover it. Until 2026-09-30 every run of this workflow,
# from the first (#1) to #14, failed within 3-6 seconds with no log at all: the jobs
# never reached their first step, not even checkout. The reason GitHub gave, verbatim:
#
#   "The job was not started because your account is locked due to a billing issue."
#
# It was an account-wide lock, so it applied even though this repository is public.
# The owner cleared it, and run #15 (started by hand against the branch of PR #9) went
# green on all four jobs: python 3.10, python 3.14, ui, and rust. That run is the only
# place the suite has been seen passing on GitHub's own Ubuntu image and on the newest
# Python, which is what it is for: a second opinion from a machine that is not the
# developer's.
#
# From 2026-09-30 to 2026-10-03 it was started by hand only, so a pull request carried a
# result only if someone asked for one. It now runs on its own. `make ci-report` still
# publishes the local gate's verdict on the commit as a status, which needs no runner: it
# is the mark a pull request carries if Actions is ever locked again (that failure looks
# like the runs above, over in seconds with no log).
#
# `push` is limited to master: a pull request's own pushes already arrive as
# `pull_request`, so an unrestricted `push:` would run every pull request twice. There is
# no path filter, because the docs are under test (tests/test_claude_md_contracts.py reads
# them) and a documentation-only change can turn the suite red.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python ${{ matrix.python }} — lint, tests, stream isolation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor pyproject.toml declares (`requires-python`) and 3.14 the
        # newest tested. Both ends are covered deliberately: the engine is spawned
        # as `python3 -m engine` by the desktop shell, so the floor is a real
        # deployment target rather than a formality.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the engine and its dev tools
        run: |
          python -m pip install --upgrade pip
          # One list: `pyproject.toml`, the engine's dependencies and the `dev` extra (ruff, mypy, httpx2, ...).
          # `make lint` and `make typecheck` need the dev tools on PATH. A tools list written out here was a
          # second copy of the extra, free to drift from it (tests/test_dependency_parity.py pins the rest).
          python -m pip install -e ".[dev]"

      # Rules and target-version are pinned in pyproject.toml, so this checks the
      # same thing on every machine — including the syntax ruff only rejects for
      # the declared 3.10 target.
      - name: Lint
        run: make lint

      # mypy's python_version = "3.10" (same pin, same reason): on the 3.10 leg it
      # resolves against the real old stdlib types, on 3.14 it still checks the
      # floor's rules — two views of the same annotations, one job.
      - name: Typecheck
        run: make typecheck

      - name: Tests
        run: make test

      # Run by name on purpose: the stream-isolation guarantees must stay in the
      # gate even if the discovery pattern is ever narrowed.
      - name: Stream isolation
        run: make test-streams

      # The hermetic benchmark tier, under both drivers: the conductor (what a person's goal gets) and the fixed
      # pipeline, each against a canned model. A few seconds, no network, no spend, and part of `make check`, so the
      # same thing runs here. It proves the harness and the execution paths still do their job together, never model
      # quality (docs/08).
      - name: Benchmark smoke tier
        run: make bench-smoke

  ui:
    name: ui — unit tests, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The floor, exactly, as the Python job pins 3.10: the UI suite runs through `node --test` with type
          # stripping and a module loader, and jsdom 30 declares 22.22.2 / 24.15 / 26 (`ui/package.json` engines,
          # checked by `make test-ui`). A bare "22" took whichever 22.x the runner image had cached, so the floor
          # was never the version that ran.
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci
        working-directory: ui

      # `npm run build` typechecks and bundles but never executes ui/tests/, which
      # is why these are separate steps. Nor does `node --test` typecheck them:
      # `--experimental-strip-types` erases types instead of checking them, so a
      # test that drifted from the interface it renders is a third way the UI
      # job could go green over something real. Hence its own leg.
      - name: UI unit tests
        run: make test-ui

      - name: Typecheck UI tests
        run: make typecheck-ui-tests

      - name: Typecheck and build
        run: make build-ui

  rust:
    name: rust — cargo check, tests, fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Tauri v2 links the platform webview: without these the crate does not
      # compile at all on a bare runner.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            bubblewrap \
            xvfb

      # `make check-tauri` runs `cargo test`, and the machine tab's tests (docs/09 §14) run
      # a real bubblewrap jail and the `unshare` that mounts its project layer: they fail
      # loudly rather than skip when the machine cannot make one. Ubuntu 24.04 restricts
      # unprivileged user namespaces through AppArmor, which is what both need, so lift
      # that for this job. `bubblewrap` and `xvfb` above are for the same tests and for the
      # one GTK test, which needs a display (the Makefile finds `xvfb-run` by itself). If an
      # image has no such sysctl the tests that follow say what is missing.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `cargo check` compiles without the frontend bundle, so this job needs no
      # Node toolchain — verified by running it with ui/dist removed.
      - name: Check, test, lint and format
        run: make check-tauri
