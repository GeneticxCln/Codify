name: check

# CONTRIBUTING.md states the bar in one line: "`make check` must pass." This runs
# that same gate in CI — the union of the three jobs below is exactly the targets
# `make check` depends on (lint, typecheck, test-ui, typecheck-ui-tests, test,
# test-streams, build-ui, check-tauri), split by toolchain so a Python failure
# cannot hide a Rust one and
# each job installs only the toolchain it needs.
#
# Until this existed there was no CI at all, and the failures that reached the
# repository were the ones a single local interpreter cannot see: a PEP 701
# f-string that parsed on 3.14 and was a SyntaxError on the declared 3.10 minimum,
# and a WebSocket isolation test that skipped itself (passing) whenever an
# undeclared `websockets` package was missing.
#
# NOTE: this workflow is manual (`workflow_dispatch`), and the gate is `make ci` in the
# Makefile, which runs these same targets locally on the host toolchain and on the
# declared-minimum Python (provisioning it rather than skipping it). Keep the two in
# step, or fold this file into `make ci` and drop the duplicate definition.
#
# History, so nobody has to rediscover it. Until 2026-09-30 every run of this workflow,
# from the first (#1) to #14, failed within 3-6 seconds with no log at all: the jobs
# never reached their first step, not even checkout. The reason GitHub gave, verbatim:
#
#   "The job was not started because your account is locked due to a billing issue."
#
# It was an account-wide lock, so it applied even though this repository is public.
# The owner cleared it, and run #15 (started by hand against the branch of PR #9) went
# green on all four jobs: python 3.10, python 3.14, ui, and rust. That run is the only
# place the suite has been seen passing on GitHub's own Ubuntu image and on the newest
# Python, which is what it is for: a second opinion from a machine that is not the
# developer's.
#
# It stays manual on purpose. `make ci` (pre-push hook, `make hooks`) is the verdict
# that gates a push, and `make ci-report` publishes it on the commit as a status. Start
# this by hand when a second opinion is worth its runner minutes: a change to the
# interpreter matrix, to a system package the Rust job installs, or before a release.
# To run it on every push and pull request, add `push:` and `pull_request:` under `on:`.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python ${{ matrix.python }} — lint, tests, stream isolation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor pyproject.toml declares (`requires-python`) and 3.14 the
        # newest tested. Both ends are covered deliberately: the engine is spawned
        # as `python3 -m engine` by the desktop shell, so the floor is a real
        # deployment target rather than a formality.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r engine/requirements.txt
          # Dev tools, not engine dependencies; `make lint`/`make typecheck` need
          # them on PATH.
          python -m pip install "ruff>=0.6" "mypy>=1.11" "httpx2>=2.13,<3"

      # Rules and target-version are pinned in pyproject.toml, so this checks the
      # same thing on every machine — including the syntax ruff only rejects for
      # the declared 3.10 target.
      - name: Lint
        run: make lint

      # mypy's python_version = "3.10" (same pin, same reason): on the 3.10 leg it
      # resolves against the real old stdlib types, on 3.14 it still checks the
      # floor's rules — two views of the same annotations, one job.
      - name: Typecheck
        run: make typecheck

      - name: Tests
        run: make test

      # Run by name on purpose: the stream-isolation guarantees must stay in the
      # gate even if the discovery pattern is ever narrowed.
      - name: Stream isolation
        run: make test-streams

  ui:
    name: ui — unit tests, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # `make test-ui` runs the TypeScript tests directly through
          # `node --test --experimental-strip-types`, which needs 22.6+. The Vite
          # build only needs 18+, so 22 is the floor for the whole UI job.
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci
        working-directory: ui

      # `npm run build` typechecks and bundles but never executes ui/tests/, which
      # is why these are separate steps. Nor does `node --test` typecheck them:
      # `--experimental-strip-types` erases types instead of checking them, so a
      # test that drifted from the interface it renders is a third way the UI
      # job could go green over something real. Hence its own leg.
      - name: UI unit tests
        run: make test-ui

      - name: Typecheck UI tests
        run: make typecheck-ui-tests

      - name: Typecheck and build
        run: make build-ui

  rust:
    name: rust — cargo check, fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Tauri v2 links the platform webview: without these the crate does not
      # compile at all on a bare runner.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            pkg-config \
            build-essential

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `cargo check` compiles without the frontend bundle, so this job needs no
      # Node toolchain — verified by running it with ui/dist removed.
      - name: Check
        run: make check-tauri
