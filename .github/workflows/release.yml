name: release

# Push a tag like `v1.0.0` and the packages people download come out of this workflow:
# a deb, an rpm, a portable tar, an AppImage, an Arch package and its PKGBUILD, their
# checksums, and a GitHub release that carries all of them. Every package carries the
# engine and the Python it runs on (`scripts/bundle_engine.py`), so none needs a checkout
# beside it, and each is booted here before anything is published.
#
# **What this is not.** It is not a second gate. `make ci` is the gate and it runs before a
# commit reaches master (`make hooks` installs the pre-push hook; `check.yml` runs the same
# targets on GitHub's runners for every pull request and every push to master). This workflow
# builds and publishes; if the tag's commit was never gated, that is a fact about how the tag
# was cut, not something this file can fix by re-running the suite and calling itself the
# answer. The one check it *does* make is the one this workflow alone can make wrong: that the
# three files carrying the version agree with each other and with the tag (below).
#
# **Why Ubuntu 22.04 and not `ubuntu-latest`.** The base image is a floor, not a convenience.
# Tauri's own AppImage guide says it in as many words: glibc breaks compatibility with older
# systems, so the app must be built on the oldest base system intended to be supported, and
# 22.04 is that system for Tauri v2 (it is the oldest that carries `libwebkit2gtk-4.1-dev`
# from its own repositories). A 24.04 build produces a package that refuses to start on
# 22.04 with `GLIBC_2.39 not found` — a failure that shows up on someone else's machine, after
# the release is out, and which no amount of testing here would catch. So the version is
# pinned deliberately, and bumping it is a decision about who can install this, not upkeep.
#
# **Why the stable Rust toolchain and not the 1.90 in Cargo.toml.** `rust-version` is a real
# promise and the gate checks it against the locked dependency graph
# (`scripts/check_msrv.py`, run by `make check-tauri`). This workflow is not the place that
# promise is kept, and pinning the release build to 1.90 would make `cargo install tauri-cli`
# fail the day the CLI's own MSRV moves past it, in a workflow whose whole job is to produce
# a file. `cargo install` takes its toolchain where it is run, so stable keeps a release from
# being blocked by a build tool's requirements.
#
# **What a person does with the output.** The app's About tab asks GitHub for the *latest*
# release — this one, once published — and can download the package for the copy that is
# running. It installs nothing and replaces nothing: the deb is handed over with the `apt`
# command to run, and the AppImage with the `chmod +x` (docs/18 §4). The rpm, tar and Arch
# package are for the package managers and portable installs those names describe.

on:
  push:
    tags: ["v*"]
  # Two jobs by hand. With `publish` and an existing tag: a release that has to be built again —
  # a bad upload, a runner that died. Without `publish` (the default): a dry run that builds every
  # package from the ref it was started on, smoke-tests them exactly as a release would, and
  # leaves them as a workflow artifact — no tag, no release, nothing any copy of the app can see.
  # That is how a change to the packaging is tried before the release that would ship it.
  workflow_dispatch:
    inputs:
      tag:
        description: "With publish: the existing tag to publish (e.g. v1.0.0). Empty for a dry run."
        required: false
        type: string
      publish:
        description: "Publish a GitHub release. Off: build and smoke-test only, and upload the packages as an artifact."
        required: false
        type: boolean
        default: false

# Restrict workflow-level permissions to read-only so mutable build steps (tauri-cli, pacman,
# bundler tools) never hold release-write or OIDC signing tokens. Only the dedicated `publish` job
# below is granted `contents: write`, `id-token: write`, and `attestations: write`.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancelled: a half-uploaded release is worse than a slow one, and a re-run uploads
  # with `--clobber` (below) rather than making a second release.
  cancel-in-progress: false

jobs:
  packages:
    name: build and smoke-test deb + rpm + tar + AppImage + Arch package
    runs-on: ubuntu-22.04
    # `cargo install tauri-cli` is minutes of compilation, the app build is minutes more, and
    # the AppImage bundler downloads its own tools. Well under this, and a build that somehow
    # hangs ends here instead of holding the run for six hours.
    timeout-minutes: 75
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    env:
      # A pushed tag always publishes; a run by hand only when it is asked to.
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags, so the check below can prove the tag being published exists, and full
          # history, because a tag is not a branch head.
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The one thing this workflow can get wrong that nothing else can see. A release whose
      # tag says `v1.0.0` while `tauri.conf.json` still says `0.2.0` is worse than a missing
      # release: the About tab compares the running version against the latest tag, so every
      # copy of that build would offer an update to the thing it already is, forever. Four
      # files carry the version by hand, so they are compared here, in one step, with the tag.
      #
      # A dry run has no tag, so it holds the version files to each other instead, under the
      # version they carry: the same script, the same refusal when one of them disagrees.
      - name: The tag, the shell, the crate and the UI must agree on a version
        id: version
        env:
          # The dispatch input is data, never a shell fragment: it arrives through
          # the environment and is checked against the tag shape before any use.
          TAG_INPUT: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            TAG="$TAG_INPUT"
            [ -n "$TAG" ] || TAG="$REF_NAME"
          else
            TAG="v$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
            echo "A dry run: building $TAG from $REF_NAME, publishing nothing."
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing to publish: '$TAG' is not a version tag like v1.2.3." >&2
            exit 1
          fi
          if [ "$PUBLISH" = "true" ]; then
            git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null || {
              echo "There is no tag $TAG in this repository, so there is nothing to publish." >&2
              exit 1
            }
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          python3 scripts/release_notes.py "$TAG" > release-notes.md
          cat release-notes.md

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # The floor `ui/package.json` declares (`engines`) and `check.yml` pins for the same
          # reason: the UI suite runs through `node --test` with type stripping, and a bare
          # "22" resolves to whichever 22.x the runner has cached — never the floor.
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci
        working-directory: ui

      # The engine every package carries (`docs/18` §2): the CPython pinned in
      # packaging/python.json, checked against its SHA-256, the wheels packaging/engine.lock
      # names installed with --require-hashes, and engine/. The script runs on any Python
      # 3.10+; the interpreter it builds with is the pinned one, so this is only the runner's
      # way of starting it.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Build the engine the packages carry
        run: python3 scripts/bundle_engine.py

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # Tauri v2 links the platform webview, and the deb, rpm and AppImage bundlers need tools
      # that are not on a bare runner: `patchelf` for linuxdeploy's AppImages, `rpmbuild` for
      # the rpm, `bsdtar` for the smoke checks of the rpm and Arch package, `file` for the
      # bundlers' own checks, `wget` because linuxdeploy and appimagetool arrive that way.
      - name: Install the build and bundling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libxdo-dev \
            pkg-config \
            build-essential \
            patchelf \
            rpm \
            libarchive-tools \
            file \
            wget \
            curl

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      # The slowest step in this workflow, pinned to an exact version and `--locked`: the Tauri
      # CLI's own version and dependency graph are fixed, so a release cannot silently pull an
      # unreviewed CLI release or transitive dependency between two tags.
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "=2.11.5" --locked

      # One command, because the targets live in `src-tauri/tauri.conf.json`
      # (`bundle.targets` is `deb`, `rpm` and `appimage`) and a list repeated here would be a
      # second place to forget. `beforeBuildCommand` builds the UI with Vite first, so the
      # shell's window carries the real frontend. `tauri.bundle.conf.json` adds the engine
      # bundle as a resource; it is kept out of tauri.conf.json so that `cargo check` never
      # needs a bundle to exist.
      #
      # `APPIMAGE_EXTRACT_AND_RUN` because appimagetool is itself an AppImage: without this it
      # needs a mounted FUSE filesystem, which a runner does not have, and the bundle step
      # fails with a confusing "failed to run linuxdeploy" instead of a FUSE error.
      - name: Build the packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo tauri build --config tauri.bundle.conf.json
        working-directory: src-tauri

      # The three native packages first. The rpm gets the same versioned file name as the
      # others so a release page, a checksum and a download command agree.
      - name: Collect the native packages
        run: |
          set -euo pipefail
          mkdir -p dist
          deb=$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          rpm=$(find src-tauri/target/release/bundle/rpm -name '*.rpm' -print -quit)
          appimage=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)
          for file in "$deb" "$rpm" "$appimage"; do
            if [ -z "$file" ]; then
              echo "The bundler did not produce every package this release promises." >&2
              find src-tauri/target/release/bundle -maxdepth 2 -type f >&2 || true
              exit 1
            fi
          done
          cp "$deb" dist/
          cp "$rpm" "dist/Codify_${VERSION}_amd64.rpm"
          cp "$appimage" dist/
          ls -lh dist

      # The portable tar is the deb's `/usr` tree, because that is the layout the shell and
      # its resource resolver already know (`/usr/bin/codify-desktop` and
      # `/usr/lib/Codify/engine-bundle`). `AppRun` is the one added file: it makes the
      # extracted tree runnable without installing it or setting a library path.
      - name: Build the portable tar
        run: |
          set -euo pipefail
          root="Codify_${VERSION}_amd64"
          rm -rf "build/$root"
          mkdir -p "build/$root"
          dpkg-deb -x "dist/Codify_${VERSION}_amd64.deb" "build/$root"
          rm -rf "build/$root/DEBIAN"
          cp LICENSE "build/$root/LICENSE"
          cat > "build/$root/AppRun" <<'RUN'
          #!/bin/sh
          set -eu
          here=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          exec "$here/usr/bin/codify-desktop" "$@"
          RUN
          chmod 755 "build/$root/AppRun"
          tar -C build -czf "dist/Codify_${VERSION}_amd64.tar.gz" "$root"

      # An Arch binary package, built from the same tar. `makepkg` runs inside Arch's own
      # base-devel image so the package metadata and compression are made by the tool that
      # owns the format; it does not compile anything, because the binary is the one Ubuntu
      # just built and the tar carries its engine.
      - name: Build the Arch package and its PKGBUILD
        run: |
          set -euo pipefail
          source="dist/Codify_${VERSION}_amd64.tar.gz"
          arch_dir=$(mktemp -d)
          # The container user must be able to create src/ and pkg/ here, while the
          # runner must still be able to read the package it writes back. A shared
          # writable directory does both; chowning the mount would lock the runner out.
          chmod 777 "$arch_dir"
          cp packaging/arch/PKGBUILD.in "$arch_dir/PKGBUILD"
          digest=$(sha256sum "$source" | cut -d' ' -f1)
          arch_pkgver="${VERSION//-/_}"
          sed -i "s/@PKGVER@/${arch_pkgver}/g; s/@VERSION@/${VERSION}/g; s/@SHA256@/${digest}/g" "$arch_dir/PKGBUILD"
          cp "$source" "$arch_dir/"
          docker run --rm \
            -v "$arch_dir:/build" \
            -w /build \
            archlinux@sha256:97119fd9e21219b02b3c14ba256c9d3c0d031d07fc26c836c41ed793beeb5b74 \
            bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm --needed zstd
              useradd -m builder
              su builder -c "cd /build && PKGDEST=/build makepkg --noconfirm --nodeps"
            '
          package=$(find "$arch_dir" -maxdepth 1 -name 'codify-bin-*.pkg.tar.zst' -print -quit)
          if [ -z "$package" ]; then
            echo "makepkg produced no Arch package." >&2
            ls -la "$arch_dir" >&2
            exit 1
          fi
          cp "$package" "dist/Codify_${VERSION}_amd64.pkg.tar.zst"
          cp "$arch_dir/PKGBUILD" "dist/Codify_${VERSION}_amd64.PKGBUILD"
          ls -lh dist

      # Every asset, their checksums, and a hard failure when one is missing: a release with
      # no assets looks published and cannot be installed, and the update button would offer
      # a version with nothing behind it.
      - name: Write the checksums and fail if any asset is missing
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          assets=(Codify_*.deb Codify_*.rpm Codify_*.tar.gz Codify_*.AppImage Codify_*.pkg.tar.zst Codify_*.PKGBUILD)
          if [ ${#assets[@]} -lt 6 ]; then
            echo "The release produced ${#assets[@]} of the 6 assets it promises:" >&2
            ls -la . >&2
            exit 1
          fi
          sha256sum "${assets[@]}" > SHA256SUMS
          cat SHA256SUMS

      # Each package is unpacked (never installed) and the engine inside it is booted the way
      # the shell boots it: its own Python, a throwaway CODIFY_HOME, a GET /health that must
      # answer 200, and not one file in the bundle written while it ran. A package whose
      # engine cannot start is a window that says so on every machine it reaches, and this is
      # the only place that can be known before it does (scripts/smoke_bundle.py).
      - name: Boot the engine every package carries
        run: |
          python3 scripts/smoke_bundle.py --deb dist/Codify_*.deb --version "$VERSION"
          python3 scripts/smoke_bundle.py --rpm dist/Codify_*.rpm --version "$VERSION"
          python3 scripts/smoke_bundle.py --tar dist/Codify_*.tar.gz --version "$VERSION"
          python3 scripts/smoke_bundle.py --appimage dist/Codify_*.AppImage --version "$VERSION"
          python3 scripts/smoke_bundle.py --arch dist/Codify_*.pkg.tar.zst --version "$VERSION"

      # A dry run ends here, with the packages it built kept for a person to try.
      - name: Keep the dry run's packages
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codify-${{ env.VERSION }}-dry-run
          path: dist/
          retention-days: 7

      # Hand the built and smoke-tested packages off to the dedicated publish job so mutable build
      # steps never hold OIDC attestation or release-write permissions.
      - name: Stage the release packages for publishing
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codify-release-stage
          path: |
            dist/
            release-notes.md
          retention-days: 1

  publish:
    name: attest and publish GitHub release
    needs: packages
    if: needs.packages.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    # `contents: write` creates the release and uploads its assets; `id-token: write` mints the
    # keyless OIDC certificate; `attestations: write` stores the signed provenance beside the repo.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      PUBLISH: ${{ needs.packages.outputs.publish }}
      TAG: ${{ needs.packages.outputs.tag }}
      VERSION: ${{ needs.packages.outputs.version }}
    steps:
      - name: Download the staged packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codify-release-stage
          path: .

      # A signed claim that this workflow built these exact bytes. Sigstore issues a short-lived
      # certificate to this run's OIDC identity, so there is no key to leak, rotate or forget in a
      # secret. Every package, the PKGBUILD and the checksums file are subjects; a person checks
      # one with `gh attestation verify <file> --repo GeneticxCln/Codify` (docs/18 §5). The
      # attestation is gated on PUBLISH == 'true' (never minted on dry runs) and runs before
      # publishing, so a release whose provenance cannot be signed does not go out.
      - name: Attest the packages and their checksums
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Codify_*.deb
            dist/Codify_*.rpm
            dist/Codify_*.tar.gz
            dist/Codify_*.AppImage
            dist/Codify_*.pkg.tar.zst
            dist/Codify_*.PKGBUILD
            dist/SHA256SUMS

      # Published, not drafted: the update button reads `releases/latest`, and GitHub's answer
      # to that is the newest release that is neither a draft nor a pre-release — so a draft
      # would be a release nobody's app can see. It also means this is the moment the button
      # starts offering a new version, which is why the version check above runs first.
      #
      # A re-run uploads over the same tag instead of failing on "release already exists",
      # which is the only way to fix an asset that was uploaded wrong.
      - name: Publish the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, so its assets are replaced instead of a second one made."
            gh release upload "$TAG" dist/Codify_* dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" \
              --title "Codify $TAG" \
              --notes-file release-notes.md \
              dist/Codify_* dist/SHA256SUMS
          fi
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[].name)'
