[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codify-engine"
version = "0.2.0"
description = "Codify Multi-Agent Engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # Not optional, and not only a test dependency: uvicorn resolves its WebSocket
    # implementation to None when neither `websockets` nor `wsproto` is importable
    # (uvicorn/protocols/websockets/auto.py), and then it serves no WebSocket at all.
    # Every goal's transcript arrives over `/ws/goals/{id}`, so an install without
    # this opens a chat that can never receive an event. uvicorn's own [standard]
    # extra pins the same floor, which is the version it is tested against.
    "websockets>=13",
    "pydantic>=2.10",
    "httpx>=0.28",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.mypy]
# The same floor as ruff below, for the same reason: the engine is booted as
# `python3 -m engine`, so what the declared minimum interpreter accepts is a
# deployment question, not a preference.
python_version = "3.10"
# Everything the project ships, tests included: the suite is the only thing holding
# most of these contracts, and a test that indexes an Optional or unpacks a value
# into the wrong shape is a failing assertion waiting to happen.
files = ["engine", "tests", "scripts"]
# pydantic v2 models are not understood without it. Without the plugin a field
# declared `fallback_model_name: str = Field("", ...)` reads as a *required*
# argument, so every model constructor reports missing arguments it does not have —
# three of them in `engine/models.py` alone.
plugins = ["pydantic.mypy"]
# The type-checking floor for everything the repo ships (engine, tests, scripts):
# every def declares its types, every generic is parameterized, and no function
# returns an untyped Any. New modules inherit the bar rather than opting into it.
# The config equals --strict flag for flag (warn_unused_configs is meaningless
# here — files is pinned explicitly); warn_unreachable is one step beyond it.
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
warn_return_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
no_implicit_reexport = true
extra_checks = true
warn_unreachable = true

[[tool.mypy.overrides]]
# The Laya System-1 SDK is optional by design: `engine/laya.py` probes for it and
# falls back to the LLM gate when it is absent (docs/05). It is not a dependency
# and ships no stubs, so a missing import here is the documented normal case.
module = ["laya", "laya.*"]
ignore_missing_imports = true

[tool.ruff]
# The oldest interpreter this project promises (`requires-python` above). Pinned
# here rather than inferred, so ruff reports syntax that 3.10/3.11 reject instead
# of accepting whatever the developer's own interpreter happens to allow. A PEP 701
# f-string reached `engine/executor.py` that way: it parsed on 3.14 and was a
# SyntaxError on the declared minimum. CI runs the suite on 3.10 to prove it.
target-version = "py310"

[tool.ruff.lint]
# The rule set, written out so `make lint` cannot change meaning with the ruff
# build or a machine-local config. That is not hypothetical: the ruff on the
# maintainer's machine checked ~400 rules by default, which turned a gate that
# should pass into 189 findings nobody had triaged. Each set was adopted with
# its fixes, one at a time.
#
# E4  import handling      E7  statements        E9  syntax errors
# F   pyflakes: unused imports/variables, undefined names, redefinitions
# B   bugbear: likely bugs (raise-from inside except, zip strictness)
# S   bandit-style security findings — triaged per site, see per-file-ignores
# UP  pyupgrade: PEP 604 unions, collections.abc imports, unquoted annotations
select = ["E4", "E7", "E9", "F", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
# Every exemption below was looked at, not assumed. The triage that put each
# one here:
#
# S101  `assert` — in tests, narrowing before an index is the point of the
#       line. In engine/executor.py it guards an internal invariant, and the
#       engine runs as `python3 -m engine`, so asserts are NOT stripped and
#       the check is real defence, not dead code.
# S110/S112  try-except-pass/continue — the paths documented as best-effort:
#       boot rescue of orphaned goals, stats history maintenance ("must never
#       be able to fail the read that triggers it"), stream cleanup, the GTK
#       folder-picker probe. Log events live in per-goal streams these paths
#       cannot always reach.
# S603/S607  subprocess — every call is an argv list (no shell=True); the
#       partial-path `git`/`python3` names resolve on PATH by design.
# S608  SQL interpolation — every site interpolates engine-owned identifiers
#       only (placeholders generated from a list's length, column names from
#       code, a WHERE clause built from literal strings); values always travel
#       as bound parameters.
# S108  /tmp literals — the sandbox tests assert refusal of /tmp paths, and
#       the laya/library tests need a path *shape*, not a usable directory.
"tests/*" = ["S101", "S603", "S607", "S608", "S108"]
"engine/app.py" = ["S110", "S603", "S607", "S608"]
"engine/db.py" = ["S110"]
"engine/executor.py" = ["S101", "S110", "S608"]
"engine/git.py" = ["S603"]
"engine/providers.py" = ["S110"]
"engine/sandbox.py" = ["S603"]
"engine/spawn_guard.py" = ["S603"]
"engine/services.py" = ["S608", "S112"]
"engine/stats_history.py" = ["S608"]

[tool.setuptools.packages.find]
include = ["engine*"]
