[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codify-engine"
version = "0.2.0"
description = "Codify Multi-Agent Engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    # Not optional, and not only a test dependency: uvicorn resolves its WebSocket
    # implementation to None when neither `websockets` nor `wsproto` is importable
    # (uvicorn/protocols/websockets/auto.py), and then it serves no WebSocket at all.
    # Every goal's transcript arrives over `/ws/goals/{id}`, so an install without
    # this opens a chat that can never receive an event. uvicorn's own [standard]
    # extra pins the same floor, which is the version it is tested against.
    "websockets>=13,<18",
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "keyring>=25.0,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    # Starlette's TestClient prefers this over httpx and falls back to httpx with a
    # deprecation warning; a later Starlette will require it. Tests only — the engine's
    # own outbound calls stay on `httpx` above.
    "httpx2>=2.13,<3",
    # Regenerates the checked-in logo/desktop icons on demand
    # (scripts/make_logo.py); nothing in the gate invokes it.
    "pillow>=10.0",
]

[tool.mypy]
# The same floor as ruff below, for the same reason: the engine is booted as
# `python3 -m engine`, so what the declared minimum interpreter accepts is a
# deployment question, not a preference.
python_version = "3.10"
# Everything the project ships, tests included: the suite is the only thing holding
# most of these contracts, and a test that indexes an Optional or unpacks a value
# into the wrong shape is a failing assertion waiting to happen.
files = ["engine", "tests", "scripts", "benchmarks"]
# pydantic v2 models are not understood without it. Without the plugin a field
# declared `fallback_model_name: str = Field("", ...)` reads as a *required*
# argument, so every model constructor reports missing arguments it does not have —
# three of them in `engine/models.py` alone.
plugins = ["pydantic.mypy"]
# The type-checking floor for everything the repo ships (engine, tests, scripts):
# every def declares its types, every generic is parameterized, and no function
# returns an untyped Any. New modules inherit the bar rather than opting into it.
# The config equals --strict flag for flag (warn_unused_configs is meaningless
# here — files is pinned explicitly); warn_unreachable is one step beyond it.
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
warn_return_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
no_implicit_reexport = true
extra_checks = true
warn_unreachable = true

[[tool.mypy.overrides]]
# The Laya System-1 SDK is optional by design: `engine/laya.py` probes for it and
# falls back to the LLM gate when it is absent (docs/05). It is not a dependency
# and ships no stubs, so a missing import here is the documented normal case.
module = ["laya", "laya.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# The ML stack laya pulls in (torch, numpy, transformers), when a developer has
# installed the SDK. Two problems, one answer: their stubs use PEP 695 syntax
# (numpy's `type` statements), which the 3.10 target mypy checks with cannot
# parse at all — an error that would stop the whole run — and none of it is
# code this repo ships or reviews. `follow_imports = skip` tells mypy to treat
# anything reached from laya as opaque rather than reading it; with the SDK
# absent, `ignore_missing_imports` above is the only half that does anything.
module = ["torch", "torch.*", "numpy", "numpy.*", "transformers", "transformers.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Pillow, for the logo generator, is the same shape as Laya above: a `dev` extra,
# imported inside a guard that explains how to install it, on a script whose whole
# job is drawing images. The declared-minimum leg installs only the engine
# requirements plus ruff and mypy, so it reads this file with neither the library
# nor its stubs.
#
# Named by the *imported* module, like `laya` above and not like the file that
# imports it: a per-module option is matched against the name mypy could not
# resolve. Naming the script here changes nothing, which is a quiet way to
# believe a config entry is doing something.
#
# An override rather than a `# type: ignore[import-not-found]` on the import,
# because the two legs disagree in the other direction: a developer who installed
# the `dev` extra *has* the stubs, so the same ignore is then reported as unused —
# and an unused ignore is an error here (CLAUDE.md, working rules). One config
# entry is correct in both environments; an ignore cannot be.
#
# `follow_imports = "skip"` is the half that matters when the library *is*
# installed. `ignore_missing_imports` alone says nothing about a module mypy did
# resolve, so it walked into Pillow's own stubs — and from there into numpy's,
# whose PEP 695 `type` statements the 3.10 target cannot parse. That stopped the
# whole run on a syntax error in a dependency's stub, raised by a script whose
# only job is drawing a logo. Neither library is code this repo ships or reviews.
#
# `PIL.*` is not optional: the import is `from PIL import Image`, and a bare `PIL`
# matches the package and nothing under it, so mypy read `PIL/Image.pyi` anyway —
# which is where the numpy import actually lives.
module = ["PIL", "PIL.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
# The oldest interpreter this project promises (`requires-python` above). Pinned
# here rather than inferred, so ruff reports syntax that 3.10/3.11 reject instead
# of accepting whatever the developer's own interpreter happens to allow. A PEP 701
# f-string reached `engine/executor.py` that way: it parsed on 3.14 and was a
# SyntaxError on the declared minimum. CI runs the suite on 3.10 to prove it.
target-version = "py310"

[tool.ruff.lint]
# The rule set, written out so `make lint` cannot change meaning with the ruff
# build or a machine-local config. That is not hypothetical: the ruff on the
# maintainer's machine checked ~400 rules by default, which turned a gate that
# should pass into 189 findings nobody had triaged. Each set was adopted with
# its fixes, one at a time.
#
# E4  import handling      E7  statements        E9  syntax errors
# F   pyflakes: unused imports/variables, undefined names, redefinitions
# B   bugbear: likely bugs (raise-from inside except, zip strictness)
# S   bandit-style security findings — triaged per site, see per-file-ignores
# UP  pyupgrade: PEP 604 unions, collections.abc imports, unquoted annotations
select = ["E4", "E7", "E9", "F", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
# Every exemption below was looked at, not assumed. The triage that put each
# one here:
#
# S101  `assert` — in tests, narrowing before an index is the point of the
#       line. In engine/executor.py it guards an internal invariant, and the
#       engine runs as `python3 -m engine`, so asserts are NOT stripped and
#       the check is real defence, not dead code.
# S110/S112  try-except-pass/continue — the paths documented as best-effort:
#       boot rescue of orphaned goals, stats history maintenance ("must never
#       be able to fail the read that triggers it"), stream cleanup, the GTK
#       folder-picker probe. Log events live in per-goal streams these paths
#       cannot always reach.
# S603/S607  subprocess — every call is an argv list (no shell=True); the
#       partial-path `git`/`python3` names resolve on PATH by design. Only `tests/*`
#       is exempt wholesale. In `engine/`, `benchmarks/` and `scripts/` there is no
#       per-file exemption: each spawn carries its own `# noqa: S603 — <why>` on the
#       line, so a *second* raw spawn in a file that already has a justified one is a
#       finding, not a freebie (review of 2026-09-29). `tests/test_no_unguarded_spawns.py`
#       holds the same line from the other side.
# S608  SQL interpolation — every site interpolates engine-owned identifiers
#       only (placeholders generated from a list's length, column names from
#       code, a WHERE clause built from literal strings); values always travel
#       as bound parameters.
# S108  /tmp literals — the sandbox tests assert refusal of /tmp paths, and
#       the laya/library tests need a path *shape*, not a usable directory.
# S310  urlopen — the preview-engine test probes the engine's /health on
#       127.0.0.1 with a URL built from an f-string over a port the test
#       itself chose; the scheme is a literal https-less loopback http, which
#       is the whole point of the probe.
# S110 (conductor.py)  the `on_tool` progress callback. It is a notification
#       that a tool was called, published so the transcript can show the
#       dispatch; a renderer that throws while rendering must not end the turn,
#       and there is nowhere to log it — the failure is in the viewer's event
#       handler, not in the run. Same shape as providers.py's usage sink, which
#       is exempted for the same reason.
# S103 (tests/test_conversations.py)  the read-only-migration test makes its temp
#       directory traversable (0o755) so that an unprivileged user can reach a file it
#       cannot write, which is how the test produces a real read-only failure when the
#       suite runs as root (root ignores file modes). The directory holds one throwaway
#       SQLite file the test created itself under the system temp root, and it is
#       removed with it; nothing of the developer's is exposed. Scoped to that one file.
"tests/*" = ["S101", "S603", "S607", "S608", "S108", "S310"]
"tests/test_conversations.py" = ["S103"]
# S103 (tests/test_state_permissions.py)  the test *creates* wide modes (0o755, 0o644) on
#       directories and files under its own temp directory, to stand in for what an older build
#       left on a real install and to prove the engine tightens them. Nothing it makes is
#       ever a real state directory, and each is removed with the temp directory. Scoped to
#       that one file.
"tests/test_state_permissions.py" = ["S103"]
"engine/app.py" = ["S110", "S608"]
"engine/conductor.py" = ["S110"]
"engine/db.py" = ["S110"]
# S110 (engine/agent_orchestrator.py)  the stream's final flush blanks the intermediate `model_delta`
#       snapshots once the final one holds all the text. It is housekeeping on a call that already
#       succeeded, and a failure to tidy must never fail that call; the delta events it would log to
#       are the ones being compacted. It moved here from engine/executor.py with the code. Scoped to
#       that one file.
"engine/agent_orchestrator.py" = ["S110"]
# S110/S608 (engine/executor_core.py)  moved here from engine/executor.py with the code, three sites and one.
#       S110: `_parallel_width` falls back to the built-in width when the settings store cannot answer (a
#       width is a tuning value, never worth failing a wave over), and `_fail` has already published the
#       `error` event by the time it tries to mark the step and the goal FAILED, so a second failure while
#       recording the first must not replace it or escape the failure handler.
#       S608: `_set_step` builds its SET clause from `status` and two column names chosen from a literal
#       tuple, and every value travels as a bound parameter. Scoped to that one file.
"engine/executor_core.py" = ["S110", "S608"]
"engine/executor.py" = ["S101", "S110", "S608"]
# S108 (engine/fs.py)  `SYSTEM_ROOTS` names `/tmp` and `/var/tmp` as directories a workspace must
#       never be. They are paths to *refuse*: nothing here creates, opens or writes a file at
#       either, which is the risk the rule exists for. Scoped to that one file.
"engine/fs.py" = ["S108"]
# E402 (engine/__main__.py)  the import below the watchdog call is not an
#       oversight to be tidied away — it is the whole file. `serve()` arms the
#       parent watchdog only after it has pulled in engine.app and everything it
#       drags along, and a shell that dies inside that window leaves an engine
#       that will never arm. So the watch is started first and `engine.app` is
#       imported afterwards, on purpose, to close the window. Moving the import
#       back to the top reopens the hole this module exists to prevent.
"engine/__main__.py" = ["E402"]
"engine/providers.py" = ["S110"]
"engine/services.py" = ["S608", "S112"]
"engine/stats_history.py" = ["S608"]
# S108 (scripts/preview_engine.py)  the default env-file path is a /tmp literal
#       because the file's whole job is to be a short-lived paste-adjacent
#       helper for a preview session, like the log files beside it; it is
#       written 0600 (pinned by tests/test_preview_engine.py) and the path is
#       overridable via CODIFY_PREVIEW_ENV_FILE.
"scripts/preview_engine.py" = ["S108", "S101"]

[tool.setuptools.packages.find]
include = ["engine*"]
